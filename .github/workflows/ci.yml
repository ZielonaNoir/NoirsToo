name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - 'codex/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run compile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  prompt-graph-qa:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prompt Graph QA Gate
        run: bun run qa:prompt-graph
