name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - 'codex/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run compile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  prompt-graph-qa:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prompt Graph QA Gate
        run: bun run qa:prompt-graph

      - name: Upload Prompt Graph QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-graph-qa-report
          path: docs/reports/playwright/**

  notify-slack:
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - quality
      - prompt-graph-qa
    steps:
      - name: Send Slack Failure Alert
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Prompt Graph CI failed on ${BRANCH}: https://github.com/${REPO}/actions/runs/${RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
