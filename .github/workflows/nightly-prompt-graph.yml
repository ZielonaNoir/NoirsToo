name: Nightly Prompt Graph QA

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  nightly-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Prompt Graph QA
        run: bun run qa:prompt-graph

      - name: Upload QA report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-graph-nightly-report
          path: docs/reports/playwright/**

      - name: Generate CI Triage Report
        if: always()
        run: bun run report:ci-triage

      - name: Upload Ops Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-graph-ops-report
          path: .output/reports/**

      - name: Send Slack Alert on Failure
        if: ${{ failure() && secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Nightly Prompt Graph QA failed: https://github.com/${REPO}/actions/runs/${RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
